<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1020"/>
      <stop offset="1" stop-color="#0e2230"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#16283a" stroke-width="1"/>
    </pattern>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#3dffb5"/>
    </linearGradient>
    <radialGradient id="chipglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3dffb5" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3dffb5" stop-opacity="0"/>
    </radialGradient>
    <style>
      .trace { fill: none; stroke: #1c6b59; stroke-width: 2.5; stroke-linejoin: round; }
      .pulse { fill: none; stroke: #3dffb5; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 18 400; animation: flow 5s linear infinite; }
      .d2 { animation-delay: -1.2s; }
      .d3 { animation-delay: -2.4s; }
      .d4 { animation-delay: -3.6s; }
      @keyframes flow { from { stroke-dashoffset: 418; } to { stroke-dashoffset: 0; } }
      .via { fill: #0a1020; stroke: #3dffb5; stroke-width: 2; }
      .pin { fill: #c9d4dc; }
      .mono { font-family: 'Courier New', Consolas, monospace; }
      .blink { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <!-- traces going into the chip from the left -->
  <g>
    <path class="trace" d="M560 110 H700 L730 140 H868"/>
    <path class="trace" d="M520 150 H640 L670 180 H760 L790 160 H868"/>
    <path class="trace" d="M600 210 H720 L750 180 H868"/>
    <path class="trace" d="M480 250 H700 L740 210 H868"/>
    <path class="pulse" d="M560 110 H700 L730 140 H868"/>
    <path class="pulse d2" d="M520 150 H640 L670 180 H760 L790 160 H868"/>
    <path class="pulse d3" d="M600 210 H720 L750 180 H868"/>
    <path class="pulse d4" d="M480 250 H700 L740 210 H868"/>
    <circle class="via" cx="560" cy="110" r="5"/>
    <circle class="via" cx="520" cy="150" r="5"/>
    <circle class="via" cx="600" cy="210" r="5"/>
    <circle class="via" cx="480" cy="250" r="5"/>
  </g>

  <!-- traces leaving the chip to the right -->
  <g>
    <path class="trace" d="M1012 140 H1100 L1130 110 H1200"/>
    <path class="trace" d="M1012 170 H1160 L1190 200 H1200"/>
    <path class="trace" d="M1012 200 H1090 L1120 240 H1200"/>
    <path class="pulse d2" d="M1012 140 H1100 L1130 110 H1200"/>
    <path class="pulse d3" d="M1012 170 H1160 L1190 200 H1200"/>
    <path class="pulse" d="M1012 200 H1090 L1120 240 H1200"/>
  </g>

  <!-- chip -->
  <circle cx="940" cy="170" r="130" fill="url(#chipglow)"/>
  <g>
    <!-- left pins -->
    <rect class="pin" x="858" y="132" width="14" height="10" rx="2"/>
    <rect class="pin" x="858" y="152" width="14" height="10" rx="2"/>
    <rect class="pin" x="858" y="172" width="14" height="10" rx="2"/>
    <rect class="pin" x="858" y="192" width="14" height="10" rx="2"/>
    <!-- right pins -->
    <rect class="pin" x="1008" y="132" width="14" height="10" rx="2"/>
    <rect class="pin" x="1008" y="162" width="14" height="10" rx="2"/>
    <rect class="pin" x="1008" y="192" width="14" height="10" rx="2"/>
    <!-- top pins -->
    <rect class="pin" x="900" y="88" width="10" height="14" rx="2"/>
    <rect class="pin" x="925" y="88" width="10" height="14" rx="2"/>
    <rect class="pin" x="950" y="88" width="10" height="14" rx="2"/>
    <rect class="pin" x="975" y="88" width="10" height="14" rx="2"/>
    <!-- bottom pins -->
    <rect class="pin" x="900" y="238" width="10" height="14" rx="2"/>
    <rect class="pin" x="925" y="238" width="10" height="14" rx="2"/>
    <rect class="pin" x="950" y="238" width="10" height="14" rx="2"/>
    <rect class="pin" x="975" y="238" width="10" height="14" rx="2"/>
    <!-- body -->
    <rect x="870" y="100" width="140" height="140" rx="10" fill="#0d1a26" stroke="#3dffb5" stroke-width="2.5"/>
    <rect x="884" y="114" width="112" height="112" rx="6" fill="none" stroke="#1c6b59" stroke-width="1.5"/>
    <circle cx="892" cy="122" r="3" fill="#3dffb5"/>
    <text class="mono" x="940" y="165" text-anchor="middle" font-size="26" font-weight="bold" fill="#3dffb5">ASIC</text>
    <text class="mono" x="940" y="190" text-anchor="middle" font-size="12" fill="#7fa8b8">RTL → GDSII</text>
  </g>

  <!-- text -->
  <text class="mono" x="60" y="105" font-size="20" fill="#3dffb5">&gt; hello, world</text>
  <text class="mono" x="60" y="175" font-size="70" font-weight="bold" fill="url(#title)">Aymaan</text>
  <text class="mono" x="62" y="212" font-size="21" fill="#c9d4dc">Electrical Engineering @ McMaster</text>
  <text class="mono" x="62" y="246" font-size="17" fill="#7fa8b8">From RTL to silicon.</text>
  <rect class="blink" x="260" y="233" width="10" height="16" fill="#3dffb5"/>
</svg>
